<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/9b42fb0bd8.js"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </head>
  <body>
    <!-- HEADER -->

    <section>
      <div class="row">
        <nav>
          <div class="logo">
            <img
              src="assets/logo.2c489fc453a1783cbadacf914efa3df6.svg"
              alt="Treact Logo"
              class="logo__img"
            />
            <h1 class="logo__text">Treact</h1>
          </div>
          <div class="nav__links">
            <ul class="page__links">
              <li><a href="#">About</a></li>
              <li><a href="#">Blog</a></li>
              <li><a href="#">Pricing</a></li>
              <li><a href="#">Contact Us</a></li>
            </ul>
            <ul class="login__links">
              <li><a href="#">Login</a></li>
              <li>
                <a href="#"><button href="#">Sign Up</button></a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </section>

    <header>
      <div class="row">
        <div class="hero">
          <div class="hero-info">
            <h1 class="hero__title">
              Beautiful React Templates <span>for you.</span>
            </h1>
            <p class="hero__description">Our templates are easy to setup, understand and customize. Fully modular components with a variety of pages and components.</p>
            <div class="hero__input">
              <form action="">
                <input type="email" placeholder="Your E-mail Address">
                <button>Get Started</button>
              </form>
            </div>
            <div class="hero__customers">
              <p>OUR TRUSTED CUSTOMERS</p>
              <div class="hero__customer-logos--wrapper">
                <img src="assets/customers-logo-strip.680ac7c2e8ae28161d2c.png" alt="" class="hero__customer-logos">
              </div>
            </div>
          </div>
          <div class="hero__img--wrapper">
            <img src="assets/design-illustration-2.6da6a00b20c07c4a9b65d1870679e1b8.svg" alt="" class="hero__img">
          </div>
        </div>
      </div>
    </header>

  </body>
</html>
